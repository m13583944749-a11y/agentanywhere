name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.GALNOOK_BUNDLE_ID || 'app.galnook.ios' }}
      SKIP_GENERATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: |
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project
        run: bash scripts/generate.sh

      - name: Run unit tests on iOS Simulator
        run: bash scripts/test.sh

      - name: Build unsigned xcarchive and IPA
        run: bash scripts/build.sh

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalNook-unsigned-${{ github.sha }}
          path: |
            .build/GalNook.xcarchive
            .build/GalNook.ipa
            .build/TestResults.xcresult
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
