name: GalNook

options:
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    GALNOOK_BUNDLE_ID: ${GALNOOK_BUNDLE_ID:-app.galnook.ios}
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  # SWCompression 4.9+ 要求 iOS 17；4.8.6 支持 iOS 11+。
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.8.6

targets:
  GalNook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios/GalNook
    settings:
      base:
        PRODUCT_NAME: GalNook
        PRODUCT_MODULE_NAME: GalNook
        PRODUCT_BUNDLE_IDENTIFIER: $(GALNOOK_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GalNook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选择个人头像和游戏封面。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - package: SWCompression
        product: SWCompression

  GalNookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios/GalNookTests
    settings:
      base:
        PRODUCT_NAME: GalNookTests
        PRODUCT_BUNDLE_IDENTIFIER: $(GALNOOK_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GalNook.app/GalNook
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: GalNook

schemes:
  GalNook:
    build:
      targets:
        GalNook: all
        GalNookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GalNookTests
    archive:
      config: Release
